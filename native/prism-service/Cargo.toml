# 棱镜的 Rust 业务服务（docs/prism/design.md 第 4 节）。
# 业务 crate 从原 Tauri 版仓库搬来，prism-service 是给 dsh Host 插件调用的 JSON-RPC 服务。
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Prism contributors"]
publish = false

[workspace.dependencies]
prism-core = { path = "crates/prism-core" }
prism-store = { path = "crates/prism-store" }
prism-provider = { path = "crates/prism-provider" }
prism-imaging = { path = "crates/prism-imaging" }
prism-catalog = { path = "crates/prism-catalog" }
prism-rules = { path = "crates/prism-rules" }
prism-io = { path = "crates/prism-io" }
prism-engine = { path = "crates/prism-engine" }
prism-pipeline = { path = "crates/prism-pipeline" }
prism-service = { path = "crates/prism-service" }


anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
# 读 xlsx / xls / ods
calamine = { version = "0.38", features = ["dates"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
# CSV 编码识别（国内后台导出的 CSV 多是 GBK）
encoding_rs = "0.8"
# 感知哈希
image_hasher = "3"
# 只开纯 Rust 的 PNG / JPEG / WebP 解码，不引入 C 库
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.9"
# 0.13 的 rustls 默认用 aws-lc-rs，Windows 上编译要额外装 CMake 和 NASM；0.12 用 ring，门槛低
# SVG 排版模板渲染（含系统字体）
resvg = "0.49"
# 写 xlsx
rust_xlsxwriter = "0.102"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 规则包解析出错时给出字段路径
serde_path_to_error = "0.1"
# 从规则包的类型生成 JSON Schema，给贡献者在编辑器里用
schemars = "1"
# 0.9 要求 Rust 1.94，先用 0.8，等最低版本抬上去再升级
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
# 迁移文件校验和
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
# 只开纯 Rust 的 deflate，不要 bzip2 / zstd 这些需要 C 库的压缩算法
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# 库代码不允许用 unwrap / expect 处理可恢复错误；测试里放开，见 clippy.toml
unwrap_used = "warn"
expect_used = "warn"

# 发布包体积优化，参考 https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
