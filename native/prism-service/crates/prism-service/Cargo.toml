# 读写 stdin / stdout 需要 io-std、io-util，工作区的 tokio 没开这两个
tokio = { workspace = true, features = ["io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
