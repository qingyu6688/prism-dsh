[package]
name = "prism-service"
description = "棱镜业务服务：stdin / stdout 上的 JSON-RPC，由 dsh Host 插件拉起"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
prism-catalog.workspace = true
prism-engine.workspace = true
prism-pipeline.workspace = true
prism-provider.workspace = true
reqwest.workspace = true
sha2.workspace = true
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
prism-core.workspace = true
prism-io.workspace = true
prism-rules.workspace = true
prism-store.workspace = true
serde.workspace = true
serde_json.workspace = true
# 参数解析失败时给出字段路径
serde_path_to_error.workspace = true
thiserror.workspace = true
# 读写 stdin / stdout 需要 io-std、io-util，工作区的 tokio 没开这两个
tokio = { workspace = true, features = ["io-std", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
mock-image-api = { path = "../mock-image-api" }
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
